<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/CRMINMOBILIARIA/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atarax CRM</title>
    <meta name="description" content="CRM inmobiliario profesional para asesores" />
    <!-- GitHub Pages SPA: restaura la ruta codificada por 404.html -->
    <script>
      (function () {
        var p = window.location.search.slice(1);
        if (p && p.startsWith('p=')) {
          var path = decodeURIComponent(p.slice(2));
          window.history.replaceState(null, null, '/' + path || '/');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

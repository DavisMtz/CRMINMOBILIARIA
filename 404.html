<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atarax CRM</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Encodes la ruta actual como query param y redirige al index
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + (l.search ? l.search : '') + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
